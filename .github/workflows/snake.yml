name: Generate snake

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2f5a9e&color_dots=#ebedf0,#dde6f3,#86a8de,#2f5a9e,#22457c
            dist/snake-dark.svg?palette=github-dark&color_snake=#86a8de&color_dots=#161b22,#1c2a40,#2f5a9e,#86a8de,#b3c9ec

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
